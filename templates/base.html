{% load static %}
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="{% static static/css/style.css %}" rel="stylesheet">

        <title>
            {% block title %}
                Scuola di Danza
            {% endblock %}
        </title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                    <img src="{% static 'img/logo.png' %}" alt="Logo Scuola di Danza" height="40">
                </a>
                
                <button 
                class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                    aria-expanded="false" aria-label="Apri il menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'about' %}">Chi siamo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#registerModal">
                                Registrati
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container my-4">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="bg-body-tertiary py-3 mt-auto">
            <div class="container text-center">
                <p class="mb-1">Telefono: 
                    <a href="tel: +39 --- -------">+39 --- -------</a>
                </p>
                <p class="mb-0">Email: 
                    <a href="mailto:info@scuoladanza.it">
                        info@scuoladanza.it
                    </a>
                </p>
            </div>
        </footer>

        <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="post">
                        {% csrf_token %}
                        <div class="modal-header">
                            <h5 class="modal-title" id="registerModalLabel">
                                Registrati
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi">
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="register-lastname" class="form-label">
                                    Cognome
                                <input type="text" class="form-control" id="register-first-name" name="first_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="register-email" class="form-label">
                                    Email
                                </label>
                                <input type="email" class="form-control" id="register-email" name="email" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                                Annulla
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Registrati
                            </button>
                            
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </body>
</html>
